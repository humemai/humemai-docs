<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Humemai Docs</title>
    <meta name="description" content="Documentation hub for Humemai products." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1220;
        --card: #121a2b;
        --text: #e6edf3;
        --muted: #9fb0c0;
        --accent: #5aa9ff;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 64px 24px;
      }
      h1 { font-size: 2.2rem; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid #1f2a40;
        border-radius: 12px;
        padding: 20px;
        text-decoration: none;
        color: inherit;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
      }
      .card h2 { margin: 0 0 8px; font-size: 1.2rem; }
      .card span { color: var(--accent); font-weight: 600; }
      footer { margin-top: 48px; color: var(--muted); font-size: 0.9rem; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Humemai Documentation</h1>
      <p>Central hub for product docs and guides.</p>

      <div class="grid">
        <a class="card" href="/arcadedb/">
          <h2>ArcadeDB Embedded (Python)</h2>
          <span>Open docs →</span>
        </a>
      </div>

      <footer>
        Need another doc set added? Update this page in the humemai-docs repo.
      </footer>
    </div>
  </body>
</html>
