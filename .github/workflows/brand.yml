# The only CI in this repository. brand/ is the HumemAI design system, vendored
# byte for byte; verify.sh fails when a file in it was edited by hand or the copy
# is partial. The bots that write the project folders never touch brand/, so
# their pushes do not start this.
name: Brand copy

on:
  pull_request:
    paths:
      - 'brand/**'
      - '.github/workflows/brand.yml'
  push:
    branches: [main]
    paths:
      - 'brand/**'
      - '.github/workflows/brand.yml'

permissions:
  contents: read

jobs:
  verify:
    name: brand/verify.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Check the vendored design system copy
        run: bash brand/verify.sh
